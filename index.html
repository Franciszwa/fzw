<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;  /* جلوگیری از اسکرول در صفحه */
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #1c1c1c;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden; /* برای جلوگیری از اسکرول */
            position: relative; /* برای اطمینان از نمایش صحیح */
        }

        /* ویدیو پس‌زمینه */
        #bgVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1; /* ویدیو در پس‌زمینه قرار می‌گیرد */
        }

        .center-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 460px;
            background: rgba(0, 0, 0, 0.5); /* شفاف‌تر */
            backdrop-filter: blur(15px); /* افکت شیشه‌ای */
            border-radius: 25px;
            box-shadow: 0 0 40px #a000ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 20px;
            text-align: center;
        }

        .circle {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: url('profile.jpg'); /* اسم فایل پروفایل */
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 30px #b300ff;
        }

        .buttons {
            display: flex;
            gap: 18px;
            width: 100%;
            justify-content: center;
        }

        .btn {
            width: 65px;
            height: 65px;
            border-radius: 15px;
            background: #b300ff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px #b300ff;
            transition: .25s;
        }

        .btn:hover {
            transform: scale(1.15);
            box-shadow: 0 0 30px #ff00f7;
        }

        .btn img {
            width: 35px;
            filter: invert(1);
        }

        /* نام Amir و ساعت کنار هم */
        .name {
            font-size: 40px;
            font-weight: bold;
            color: #fff;
            text-align: center;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            position: relative;
            display: inline-block;
        }

        .name-text {
            background: linear-gradient(90deg, #ff0080, #8000ff);
            background-clip: text;
            color: transparent;
            animation: glow 2s ease-in-out infinite, slide 4s ease-in-out infinite;
        }

        @keyframes glow {
            0% {
                text-shadow: 0 0 10px #ff0080, 0 0 20px #ff0080, 0 0 30px #8000ff, 0 0 40px #8000ff;
            }

            50% {
                text-shadow: 0 0 20px #ff0080, 0 0 30px #ff0080, 0 0 40px #8000ff, 0 0 60px #8000ff;
            }

            100% {
                text-shadow: 0 0 10px #ff0080, 0 0 20px #ff0080, 0 0 30px #8000ff, 0 0 40px #8000ff;
            }
        }

        @keyframes slide {
            0% {
                transform: translateX(-20px);
            }

            50% {
                transform: translateX(20px);
            }

            100% {
                transform: translateX(-20px);
            }
        }

        .time {
            font-size: 30px;
            text-align: center;
            margin-left: 10px; /* فاصله کمی از نام */
            font-weight: normal;
            display: inline-block;
            text-shadow: 0 0 10px #ff0080, 0 0 20px #ff0080;
            animation: colorCycle 6s linear infinite; /* انیمیشن تغییر رنگ ساعت */
        }

        /* انیمیشن تغییر رنگ ساعت */
        @keyframes colorCycle {
            0% { color: #00aaff; } /* آبی */
            16% { color: #9b00ff; } /* بنفش */
            33% { color: #ffd700; } /* زرد */
            50% { color: #00ff00; } /* سبز */
            66% { color: #ff0000; } /* قرمز */
            83% { color: #ff69b4; } /* صورتی */
            100% { color: #00aaff; } /* آبی */
        }

        /* Player hidden */
        audio {
            display: none;
        }

    </style>
</head>
<body>

<!-- 📌 ویدیو بک‌گراند -->
<video autoplay muted loop id="bgVideo">
    <source src="bg.mp4" type="video/mp4">
</video>

<!-- 📌 آهنگ — فایل باید اسمش music.mp3 باشه → خودکار پخش می‌شود -->
<audio id="autoMusic" autoplay>
    <source src="music.mp3" type="audio/mp3">
</audio>

<div class="center-box">
    <div class="circle"></div>

    <!-- 📌 نام Amir و ساعت کنار هم -->
    <div class="name">
        <span class="name-text">AMIR</span>
        <span id="clock" class="time"></span> <!-- ساعت به صورت زنده در اینجا نمایش داده می‌شود -->
    </div>

    <!-- 📌 دکمه‌ها -->
    <div class="buttons">
        <a href="https://t.me/AmirFF_777" target="_blank" class="btn"><img src="https://img.icons8.com/ios-filled/50/ffffff/telegram-app.png"></a>
        <a href="https://t.me//Franciszw" target="_blank" class="btn"><img src="https://img.icons8.com/ios-filled/50/ffffff/link.png"></a>
    </div>
</div>

<script>
    const audio = document.getElementById('autoMusic');
    let playing = false;

    // وقتی صفحه لمس بشه، آهنگ پخش میشه
    window.addEventListener('click', function() {
        if (!playing) {
            audio.play().then(() => {
                playing = true;
            }).catch((err) => {
                console.log('Audio play failed:', err);
            });
        }
    });

    // ساعت واقعی
    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const time = `${hours}:${minutes}`;
        document.getElementById('clock').textContent = time;
    }

    setInterval(updateClock, 1000); // هر ۱ ثانیه یکبار ساعت رو آپدیت می‌کنه
    updateClock(); // برای اولین بار ساعت رو بلافاصله نشون بده
</script>

</body>
</html>
